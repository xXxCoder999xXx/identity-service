# =============================================================================
# Dependabot – Zielpfad im Repo: .github/dependabot.yml
#
# Untrennbares Gegenstück zum Pinning: Fixierung (SHA-Pins, Lockfile) liefert
# Determinismus; der Bot liefert kontrollierte Bewegung – als PR, der dieselbe
# Pipeline durchläuft wie jeder Code und einen menschlichen Merge braucht.
#
# ADR-005-Kandidat: Dependabot statt Renovate. Begründung: plattformnativ,
# keine Dritt-App mit Repo-Zugriff (kleinere Lieferketten-Fläche, 6.2a),
# ausreichend für unsere zwei Ökosysteme. Renovate ist mächtiger (Gruppierung,
# Regex-Manager) – Neubewertungs-Auslöser: spürbarer PR-Lärm.
# =============================================================================
version: 2
updates:
  # Hebt SHA-Pins der Actions auf den Commit des neuen Releases und pflegt
  # den Versions-Kommentar (# vX.Y.Z) hinter dem Pin mit.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    # init und analyze sind zwei Einstiegspunkte EINES Produkts mit gemeinsamer
    # Laufzeit-Konfigurationsdatei – Versionsmischung ist ein Laufzeitfehler,
    # kein Stilproblem. Die Gruppe macht das Update atomar: ein PR, ein Diff,
    # ein konsistenter Zielzustand statt zwei strukturell unmergebarer Hälften.
    #
    # Bewusst eng gefasst (kein Sammeleimer): Nur nachweislich gekoppelte
    # Actions werden gruppiert. Ungekoppelte Actions wie setup-dotnet bleiben
    # Einzel-PRs mit eigenem Review (insbesondere bei Major-Sprüngen).
    groups:
      codeql-action:
        patterns:
          - "github/codeql-action*"
    commit-message:
      prefix: "chore"
      include: "scope"  # ergibt "chore(deps): ..." – Conventional Commits (7.6)

  # Versteht Central Package Management (Directory.Packages.props) und
  # aktualisiert die packages.lock.json-Dateien konsistent mit.
  #
  # Bewusst OHNE groups: Zwischen unseren NuGet-Paketen besteht keine
  # nachgewiesene Laufzeitkopplung wie bei init/analyze. Eine pauschale
  # "alles in einem PR"-Gruppe würde Diffs verwässern und Reviews erschweren,
  # ohne einen echten Kopplungsgrund zu dokumentieren. Sollte sich das ändern
  # (z. B. spürbarer PR-Lärm oder eine erkannte Paketgruppe), wird das als
  # bewusste, begründete Entscheidung nachgezogen – nicht als Default.
  - package-ecosystem: "nuget"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    commit-message:
      prefix: "chore"
      include: "scope"

  # ---------------------------------------------------------------------------
  # Schritt 4b Teil 4: kontrollierte Bewegung auch für Images und das SDK.
  # Die drei folgenden Blöcke sind rein additiv (OCP) – die Einträge oben
  # bleiben unangetastet. Der Job "Container & nginx" in ci.yml prüft jeden
  # dieser Bot-PRs: bauen, nginx -t, Smoke-Test im Production-Modus.
  # ---------------------------------------------------------------------------

  # Basis-Images im Dockerfile (Build- und Runtime-Stage), per Digest gepinnt.
  #
  # Bewusst OHNE groups, obwohl beide .NET-Images aus demselben Release stammen:
  # Ein Gruppenmuster muss auf die Namen passen, unter denen der Bot die Images
  # führt – und ein nicht passendes Muster wird lautlos ignoriert (Lektion aus
  # Sitzung 4). Die Gruppe wird nachgezogen, sobald echte Bot-PRs die Namen
  # zeigen und das Muster daran geprüft ist.
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    commit-message:
      prefix: "chore"
      include: "scope"

  # Images in compose.yaml (nginx-unprivileged). Eigenes Ökosystem: "docker"
  # liest keine Compose-Dateien.
  - package-ecosystem: "docker-compose"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    commit-message:
      prefix: "chore"
      include: "scope"
    # nginx bleibt auf dem Stable-Zweig. Bei nginx sind ungerade Nebenversionen
    # der Entwicklungszweig (mainline), gerade der stabile; der Bot kennt das
    # nicht und schlägt die höchste Nummer vor (PR #48: 1.30.5 -> 1.31.5, alle
    # Checks grün, gemergt und wieder zurückgenommen). Grün heißt nicht
    # regelkonform. Patch-Updates innerhalb des Zweigs kommen weiter. Der
    # Wechsel auf den nächsten Stable-Zweig ist damit eine bewusste Entscheidung
    # von Hand: Pin anheben UND diese Regel prüfen.
    ignore:
      - dependency-name: "nginxinc/nginx-unprivileged"
        update-types:
          - "version-update:semver-minor"
          - "version-update:semver-major"

  # SDK-Pin in global.json (rollForward: disable).
  #
  # Gekoppelt mit dem Build-Stage-Digest im Dockerfile, aber der Bot arbeitet
  # je Ökosystem: Ein neues SDK erzeugt ZWEI PRs (hier und unter "docker"), und
  # jeder für sich wird im Job "Container & nginx" rot, weil das SDK im Image
  # nicht zum Pin passt. Das ist gewollt – der Bot meldet, die Pipeline urteilt,
  # die beiden Änderungen werden von Hand in EINEM PR zusammengeführt.
  - package-ecosystem: "dotnet-sdk"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    commit-message:
      prefix: "chore"
      include: "scope"
