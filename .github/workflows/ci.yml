# =============================================================================
# CI-Pipeline (Schritt 3a) – Zielpfad im Repo: .github/workflows/ci.yml
# Konzept und Begründungen: Sitzung 2; Kommentare hier sind die Kurzfassung
# für Leser ohne Sitzungskontext.
# Action-Pins am 2026-07-13 gegen die offiziellen Repos aufgelöst
# (git ls-remote, gepeelte Tags) – vor dem Push gemäß Regel 6.3.2 selbst
# verifizieren: Repo öffnen → Releases/Tags → Commit des Tags vergleichen.
# =============================================================================
name: CI

on:
  push:
    branches: [main]      # bis Branch Protection (3b) wird auch direkter Push geprüft
  pull_request:
    branches: [main]      # prüft den prospektiven Merge-Stand – Prüfgegenstand für 3b
  workflow_dispatch:      # manueller Testlauf; verleiht keinerlei zusätzliche Rechte
  schedule:
    - cron: "0 5 * * 1"   # wöchentlich (Mo 05:00 UTC), eine Stunde nach CodeQL.
                          # Neues Wissen auf unverändertem Stand: NuGetAudit und
                          # der Image-Scan finden Lücken, die erst nach dem
                          # letzten Commit bekannt wurden. Ein Fehlschlag kommt
                          # per E-Mail, nicht als Check an einem Pull Request.

# Baseline für ALLE Jobs. Allowlist-Semantik: alles Nichtgenannte fällt auf "none".
# Fail-closed für die Evolution der Pipeline – künftige Jobs erben read-only.
permissions:
  contents: read

# Pro Ref genau ein lebender Lauf; jeder neue Push bricht das veraltete Urteil ab.
# (Deploy-Workflows in Phase 4 drehen das um: cancel-in-progress: false.)
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true                # kein Banner-Rauschen in den Logs
  DOTNET_CLI_TELEMETRY_OPTOUT: true  # bewusste Konfiguration statt Default (A02)

jobs:
  build-test:
    name: Build & Test    # = Name des Status-Checks für Branch Protection (3b) – stabil halten
    runs-on: ubuntu-24.04 # bewusst versioniert statt "-latest" (beweglicher Zeiger)
    timeout-minutes: 15   # deckelt Kontingentverbrauch UND Wirkzeit eines etwaigen Implantats

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Job-Token nicht in .git/config ablegen: kein späterer Step (oder
          # kompromittiertes Werkzeug) soll es vom Dateisystem lesen können.
          # Wir pushen nie aus der Pipeline – das Token hat auf der Platte
          # nichts verloren (tj-actions-Lektion).
          persist-credentials: false

      - name: .NET SDK (Version aus global.json)
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json  # eine Quelle der Wahrheit für lokal UND CI
        # Bewusst KEIN Paket-Cache: der Actions-Cache ist Angriffsfläche
        # (TanStack, Mai 2026). Neubewertung erst, wenn Restore-Zeit real schmerzt.

      - name: Restore (locked mode, inkl. NuGetAudit)
        run: dotnet restore --locked-mode
        # Eigener, benannter Schritt (Attribution): Lockfile-Bruch (NU1004) und
        # CVE-Funde (NU1901–NU1904 × TreatWarningsAsErrors) sind Lieferketten-
        # Signale und sollen als solche fehlschlagen. Ab hier verbietet
        # --no-restore/--no-build allen Folgestufen die stille Neuauflösung.

      - name: Build (Release, Warnungen = Fehler)
        run: dotnet build --configuration Release --no-restore
        # Die Strenge (TreatWarningsAsErrors, Analyzer, Nullable) lebt in
        # Directory.Build.props – die Pipeline führt Repo-Regeln aus, statt
        # eigene zu definieren: lokales Urteil == CI-Urteil.

      - name: Format-Verifikation
        run: dotnet format --verify-no-changes --no-restore
        # Rein lesend; jeder Änderungsbedarf => Exit-Code != 0 => harter Fehlschlag.
        # Position nach dem Build (Urteils-Hierarchie): erst "kompiliert es?",
        # dann "ist es unser Stil?".

      - name: Tests (Unit + Architektur)
        run: dotnet test --configuration Release --no-build
        # --no-build: getestet wird EXAKT das eben gebaute Artefakt – "dasselbe
        # Artefakt überall" im Kleinen. Läuft mit: der Architekturtest, der die
        # Abhängigkeitsregel ab jetzt bei jedem Lauf maschinell erzwingt.

  # ---------------------------------------------------------------------------
  # Schritt 4b Teil 4: Dockerfile und nginx.conf sind Code und werden wie Code
  # geprüft. Bewusst im selben Workflow und OHNE Pfadfilter: ein Job, der bei
  # Config-only-PRs nicht läuft, ist ein Gate mit Loch.
  # Bewusst nur Runner-Bordmittel (docker, docker compose, openssl, curl,
  # pwsh): keine zusätzliche Action, also keine neue Abhängigkeit (6.2a).
  # Erbt die Baseline "contents: read" – der Job pusht nichts.
  # ---------------------------------------------------------------------------
  container:
    name: Container & nginx  # = Name des Status-Checks im Ruleset (Required Check) – stabil halten
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false  # Begründung siehe Job "Build & Test"

      - name: Image bauen (ohne Push, ohne Cache)
        run: docker build --pull --tag identity-service-api:ci .
        # Beweist bei jedem Lauf die Kopplung global.json <-> Build-Stage-Digest:
        # passt das SDK im Image nicht zum Pin (rollForward: disable), scheitert
        # der Restore im Container. Die Basis-Images sind per Digest gepinnt.

      - name: Image-Metadaten prüfen (Non-Root, numerische UID)
        run: |
          set -euo pipefail
          user="$(docker image inspect identity-service-api:ci --format '{{.Config.User}}')"
          echo "Config.User=${user}"
          case "${user}" in
            ''|0|*[!0-9]*)
              echo "::error::Image-Nutzer muss numerisch und ungleich 0 sein (E-4b-4), ist: '${user}'"
              exit 1
              ;;
          esac
        # Kubernetes prüft runAsNonRoot anhand der Image-Metadaten: ein Name
        # statt einer UID oder ein fehlender USER würde dort erst beim Deploy
        # auffallen. Fail closed: leer, 0 oder nicht numerisch => rot.

      - name: Wegwerf-Zertifikate erzeugen (nginx -t und Smoke-Test)
        run: |
          set -euo pipefail
          mkdir -p certs/ca certs/edge certs/api
          openssl ecparam -name prime256v1 -genkey -noout -out certs/ca/local-dev-ca.key
          openssl req -x509 -new -sha256 -days 1 \
            -key certs/ca/local-dev-ca.key \
            -subj "/CN=ci-throwaway-ca" \
            -out certs/ca/local-dev-ca.crt
          openssl ecparam -name prime256v1 -genkey -noout -out certs/edge/edge.key
          openssl req -new \
            -key certs/edge/edge.key \
            -subj "/CN=localhost" \
            -out certs/edge/edge.csr
          printf 'subjectAltName=DNS:localhost,IP:127.0.0.1\n' > certs/edge/edge.ext
          openssl x509 -req -sha256 -days 1 \
            -in certs/edge/edge.csr \
            -CA certs/ca/local-dev-ca.crt \
            -CAkey certs/ca/local-dev-ca.key \
            -CAcreateserial \
            -extfile certs/edge/edge.ext \
            -out certs/edge/edge.crt
          openssl ecparam -name prime256v1 -genkey -noout -out certs/api/api.key
          openssl req -new \
            -key certs/api/api.key \
            -subj "/CN=api" \
            -out certs/api/api.csr
          printf 'subjectAltName=DNS:api,DNS:localhost\n' > certs/api/api.ext
          openssl x509 -req -sha256 -days 1 \
            -in certs/api/api.csr \
            -CA certs/ca/local-dev-ca.crt \
            -CAkey certs/ca/local-dev-ca.key \
            -CAcreateserial \
            -extfile certs/api/api.ext \
            -out certs/api/api.crt
          rm certs/ca/local-dev-ca.key \
            certs/edge/edge.csr certs/edge/edge.ext \
            certs/api/api.csr certs/api/api.ext
          chmod 0644 certs/edge/edge.key certs/api/api.key
        # nginx und Kestrel öffnen die konfigurierten Zertifikatsdateien; im
        # Repository liegen bewusst keine (certs/ ist nie versioniert). Die
        # Dateien entstehen im Lauf, gelten einen Tag und verschwinden mit dem
        # Runner – keine Secrets. ECDSA P-256 wie New-LocalDevCertificates.ps1.
        # Das API-Zertifikat trägt den SAN "api": Service-Name, SAN und
        # proxy_ssl_name sind gekoppelt – weicht einer ab, wird der Smoke-Test
        # rot. Der CA-Schlüssel wird nach dem letzten Signieren gelöscht.
        # chmod 0644: nginx (UID 101) und die API (UID 1654) müssen ihren
        # Wegwerf-Schlüssel lesen können.

      - name: nginx-Konfiguration validieren (nginx -t)
        run: docker compose run --rm --no-deps nginx nginx -t
        # Über compose statt "docker run": geprüft wird gegen EXAKT das in
        # compose.yaml gepinnte Image, mit denselben Mounts, read_only und
        # tmpfs – eine Quelle der Wahrheit. Hebt Dependabot den nginx-Pin an,
        # validiert dieser Schritt die Konfiguration gegen das neue Image.
        # --no-deps: der Dienst "api" wird hierfür nicht gestartet.

      - name: Stack starten (Production-Modus)
        env:
          ASPNETCORE_ENVIRONMENT: Production
        run: |
          set -euo pipefail
          docker compose up --detach --build
          docker inspect "$(docker compose ps --quiet api)" \
            --format '{{range .Config.Env}}{{println .}}{{end}}' \
            | grep --line-regexp 'ASPNETCORE_ENVIRONMENT=Production'
        # compose.yaml gibt Development nur als Vorgabe; die CI testet den
        # Modus, der später ausgeliefert wird. Der grep ist der Beweis, dass
        # die Überschreibung wirklich im Container ankommt – ohne Treffer wird
        # der Schritt rot (fail closed), statt still Development zu testen.
        # --build nutzt die Layer des Schritts "Image bauen" (derselbe Builder
        # auf demselben Runner) – kein Actions-Cache, keine zweite Kompilierung.

      - name: Smoke-Test (Health, Security-Header, Netzgrenze)
        shell: pwsh
        run: ./scripts/Test-Stack.ps1 -CaFile certs/ca/local-dev-ca.crt
        # Dasselbe Skript wie lokal: lokales Urteil == CI-Urteil. Grün ist nicht
        # gleich funktionierend – geprüft wird mit echten Anfragen durch die
        # ganze Kette, die Zertifikatskette gegen die Wegwerf-CA des Laufs.
        # Das Skript wartet selbst auf Bereitschaft (depends_on prüft keine).

      - name: Container-Logs (nur bei Fehlschlag)
        if: failure()
        run: docker compose logs --no-color --tail 100
        # Diagnose im Lauf statt Rätselraten. Das nginx-Log-Format enthält
        # keine Query-Strings (7.4), die API loggt keine Geheimnisse.

  # ---------------------------------------------------------------------------
  # Schritt 4b Teil 4: Image-Schwachstellen-Scan mit Grype (ADR-009).
  # Eigener Job statt weiterer Schritte in "Container & nginx": eigener
  # Status-Check mit eigener Aussage, und der Download der Schwachstellen-
  # Datenbank verzögert den Smoke-Test nicht. Preis: das Image wird hier ein
  # zweites Mal gebaut.
  # Der Scanner ist in compose.scan.yaml per Digest gepinnt (Dependabot pflegt
  # ihn dort) und läuft gehärtet: er bekommt das Image nur als Datei, keinen
  # Zugriff auf Docker. Kein Secret, keine Action, kein Cache.
  # ---------------------------------------------------------------------------
  image-scan:
    name: Image-Scan         # künftiger Status-Check-Name – stabil halten; noch KEIN Required Check
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false  # Begründung siehe Job "Build & Test"

      - name: Image bauen und als Datei exportieren
        run: |
          set -euo pipefail
          docker build --pull --tag identity-service-api:ci .
          mkdir -p scan/in scan/db scan/out
          docker save --output scan/in/app.tar identity-service-api:ci
          chmod 0644 scan/in/app.tar
          chmod 0777 scan/db scan/out
        # scan/ ist nie versioniert und liegt außerhalb des Build-Kontexts.
        # chmod: Der Scanner läuft als root OHNE Capabilities (cap_drop: ALL),
        # darf also fremde Dateirechte nicht übergehen. Er muss die Image-Datei
        # lesen und in die Ordner für Datenbank und Bericht schreiben können,
        # die dem Runner-Nutzer gehören. Der Runner ist kurzlebig.

      - name: Scan-Bericht (alle Funde, ohne Abbruch)
        run: >
          docker compose --file compose.scan.yaml run --rm grype
          docker-archive:/in/app.tar
          --output table
          --output json=/out/grype.json
          --output cyclonedx-json=/out/sbom.cdx.json
        # Zeigt auch Funde ohne verfügbaren Fix – sie blockieren nicht, sollen
        # aber sichtbar bleiben. Lädt die Datenbank; ohne Netz oder Datenbank
        # bricht Grype mit Fehler ab (fail closed).

      - name: Scanner sieht das Image (Betriebssystem und Pakete erkannt)
        run: |
          set -euo pipefail
          distro="$(jq -r '.distro.name // ""' scan/out/grype.json)"
          debs="$(jq '[.components[] | select((.purl // "") | startswith("pkg:deb/"))] | length' scan/out/sbom.cdx.json)"
          runtime="$(jq '[.components[] | select(.name == "Microsoft.NETCore.App.Runtime.linux-x64")] | length' scan/out/sbom.cdx.json)"
          echo "Betriebssystem=${distro} Systempakete=${debs} Runtime-Paket=${runtime}"
          if [ "${distro}" != "ubuntu" ] || [ "${debs}" -lt 1 ] || [ "${runtime}" -lt 1 ]; then
            echo "::error::Der Scanner erkennt das Image nicht vollständig. Ein Ergebnis ohne Funde wäre wertlos (ADR-009)."
            exit 1
          fi
        # Schutz gegen ein Prüfwerkzeug, das nichts findet, weil es nicht suchen
        # konnte: Das chiseled Image hat keinen Paketmanager. Erkennt Grype nach
        # einem Update weder Ubuntu noch Pakete noch die .NET-Runtime, wird der
        # Job rot statt still grün.

      - name: Scan-Gate (High oder höher mit verfügbarem Fix)
        run: >
          docker compose --file compose.scan.yaml run --rm grype
          docker-archive:/in/app.tar
          --only-fixed
          --fail-on high
          --output table
        # Schwellenwert nach ADR-009: Funde ohne Fix liegen im Basis-Image und
        # sind nicht behebbar – sie stehen im Bericht oben, stoppen aber nicht.
        # Nutzt die im Berichtsschritt geladene Datenbank desselben Laufs.
