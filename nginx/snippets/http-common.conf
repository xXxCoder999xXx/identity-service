# ---------------------------------------------------------------------------
# nginx/snippets/http-common.conf - Kontext: http (E-5-81)
# Gemeinsame Grundhaertung fuer alle Umgebungen. Eingebunden aus nginx.conf
# (lokal) und nginx.staging.conf. Nur einzeln per festem Namen einbinden,
# nie per Wildcard.
# ---------------------------------------------------------------------------

# Docker-internes DNS. Ohne Resolver UND Variable im proxy_pass loest nginx
# den Upstream "api" einmalig beim Laden der Konfiguration auf und haelt die
# IP fest - nach einem Neustart des api-Containers zeigt sie ins Leere.
resolver 127.0.0.11 valid=10s;

# Temp-Pfade explizit nach /var/cache/nginx (tmpfs), da read_only: true.
client_body_temp_path /var/cache/nginx/client_temp;
proxy_temp_path       /var/cache/nginx/proxy_temp;

server_tokens off;

# Rate Limiting: Schluessel aus der TCP-Verbindung, nicht aus
# faelschbaren Headern (Sitzung 5, 3.3).
limit_req_zone  $binary_remote_addr zone=perip:10m      rate=10r/s;
limit_conn_zone $binary_remote_addr zone=perip_conn:10m;

client_max_body_size        1m;
large_client_header_buffers 4 16k;

client_header_timeout 10s;
client_body_timeout   10s;
send_timeout          10s;
keepalive_timeout     65s;

# Query-Strings im Log = Leak-Risiko (7.4) - eigenes Format ohne $request.
log_format edge '$remote_addr - [$time_local] "$request_method $uri" '
                '$status $body_bytes_sent "$http_user_agent"';

access_log /var/log/nginx/access.log edge;
error_log  /var/log/nginx/error.log warn;
