# ---------------------------------------------------------------------------
# nginx/snippets/tls.conf - Kontext: server (E-5-81)
# TLS-Parameter jedes Server-Blocks mit Zertifikat. Die Pfade zu Zertifikat
# und Schluessel stehen NICHT hier: Sie unterscheiden sich je Umgebung.
# ---------------------------------------------------------------------------

ssl_protocols             TLSv1.2 TLSv1.3;
ssl_ciphers               ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305;
ssl_prefer_server_ciphers on;
ssl_session_tickets       off;
