# ---------------------------------------------------------------------------
# nginx/snippets/proxy-api.conf - Kontext: location (E-5-81)
# Weiterleitung an die API, mit verifiziertem TLS (Zero Trust).
# ---------------------------------------------------------------------------

# Variable statt festem String: erzwingt Laufzeit-Aufloesung
# ueber den in http-common.conf gesetzten Resolver.
set $upstream_api https://api:8443;
proxy_pass $upstream_api;

proxy_http_version 1.1;

# Zero Trust: proxy_ssl_verify ist bei nginx standardmaessig AUS.
# Ohne diese drei Zeilen waere die Verbindung zwar verschluesselt,
# aber nginx wuerde jedes beliebige Zertifikat akzeptieren.
# Der Dateiname ist bewusst neutral: Lokal, in der CI und auf Staging liegt
# unter diesem Pfad jeweils eine andere CA (getrennte Vertrauensbereiche).
proxy_ssl_verify              on;
proxy_ssl_trusted_certificate /etc/nginx/ca/internal-ca.crt;
proxy_ssl_name                api;

# X-Forwarded-For aus $remote_addr gesetzt, nicht angehaengt -
# verhindert Spoofing durch einen mitgeschickten Client-Header.
proxy_set_header Host              $host;
proxy_set_header X-Forwarded-For   $remote_addr;
proxy_set_header X-Forwarded-Proto $scheme;
