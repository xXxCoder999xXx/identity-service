# ---------------------------------------------------------------------------
# nginx/snippets/security-headers.conf - Kontext: server (E-5-81)
#
# add_header erbt nicht automatisch und wirkt ohne "always" nicht auf
# 4xx/5xx (Sitzung 5, 3.3) - deshalb gebuendelt, jede Zeile mit "always".
# Ein add_header in einem tieferen Kontext (location) ERSETZT alle hier
# gesetzten Header lautlos: dort dieses Snippet erneut einbinden.
#
# HSTS steht bewusst NICHT hier: Der Wert ist je Umgebung verschieden und
# steht in der Hauptdatei direkt neben dem include, im selben Kontext.
# ---------------------------------------------------------------------------

add_header X-Content-Type-Options  "nosniff"     always;
add_header X-Frame-Options         "DENY"        always;
add_header Referrer-Policy         "no-referrer" always;
add_header Content-Security-Policy "default-src 'none'; frame-ancestors 'none'" always;
