# ---------------------------------------------------------------------------
# nginx.conf - einziger Einstiegspunkt (IdentityService, Zero-Trust-Edge)
# Bezug: Sitzungsbericht 5, Block 3 (Zertifikate/Direktiven) + Block 4 (Zero Trust)
# Keine "user"-Direktive: nginx-unprivileged startet bereits als Nicht-Root-
# Prozess, ein Rollenwechsel per "user" braucht Root-Rechte, die er nie hat.
#
# Lokale Variante. Die Haertung steht in nginx/snippets/ (E-5-81) und gilt
# fuer jede Umgebung; hier steht nur, was sich je Umgebung unterscheidet:
# Ports, Servername, Zertifikatspfade, HSTS-Dauer.
# Snippets werden einzeln per festem Namen eingebunden, nie per Wildcard:
# Eine fremde Datei im Ordner wird so nie still mitgeladen, eine fehlende
# laesst "nginx -t" scheitern (fail closed).
# ---------------------------------------------------------------------------

worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;

    include /etc/nginx/snippets/http-common.conf;

    # ---- Catch-all: unbekannter Servername wird abgewiesen, nicht bedient.
    server {
        listen               8443 ssl default_server;
        ssl_reject_handshake on;
    }

    server {
        listen      8443 ssl;
        server_name localhost edge;

        ssl_certificate     /etc/nginx/certs/edge.crt;
        ssl_certificate_key /etc/nginx/certs/edge.key;
        include /etc/nginx/snippets/tls.conf;

        # HSTS max-age bewusst niedrig (Entwicklung): HSTS ist klebrig, der
        # Browser merkt sich die Anweisung fuer die volle Dauer. Vor Produktion
        # auf 31536000 (1 Jahr) erhoehen - aber ERST wenn HTTPS zuverlaessig
        # steht, sonst sperrt ein Zertifikatsproblem fuer ein Jahr aus.
        # Im selben Kontext wie die uebrigen Header (security-headers.conf).
        add_header Strict-Transport-Security "max-age=300" always;
        include /etc/nginx/snippets/security-headers.conf;

        include /etc/nginx/snippets/limits.conf;

        location / {
            include /etc/nginx/snippets/proxy-api.conf;
        }
    }
}
