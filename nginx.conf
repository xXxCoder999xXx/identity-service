# ---------------------------------------------------------------------------
# nginx.conf - einziger Einstiegspunkt (IdentityService, Zero-Trust-Edge)
# Bezug: Sitzungsbericht 5, Block 3 (Zertifikate/Direktiven) + Block 4 (Zero Trust)
# Kein "user"-Direktive: nginx-unprivileged startet bereits als Nicht-Root-
# Prozess, ein Rollenwechsel per "user" braucht Root-Rechte, die er nie hat.
# ---------------------------------------------------------------------------

worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;

    # Siehe Chat-Antwort Punkt 1: ohne Resolver + Variable bindet nginx die
    # IP von "api" einmalig beim Start.
    resolver 127.0.0.11 valid=10s;

    client_body_temp_path /var/cache/nginx/client_temp;
    proxy_temp_path       /var/cache/nginx/proxy_temp;

    server_tokens off;

    # Rate Limiting: Schluessel aus der TCP-Verbindung, nicht aus
    # faelschbaren Headern (Sitzung 5, 3.3).
    limit_req_zone  $binary_remote_addr zone=perip:10m      rate=10r/s;
    limit_conn_zone $binary_remote_addr zone=perip_conn:10m;

    client_max_body_size        1m;
    large_client_header_buffers 4 16k;

    client_header_timeout 10s;
    client_body_timeout   10s;
    send_timeout          10s;
    keepalive_timeout     65s;

    # Query-Strings im Log = Leak-Risiko (7.4) - eigenes Format ohne $request.
    log_format edge '$remote_addr - [$time_local] "$request_method $uri" '
                     '$status $body_bytes_sent "$http_user_agent"';
    access_log /var/log/nginx/access.log edge;
    error_log  /var/log/nginx/error.log warn;

    # ---- Catch-all: unbekannter Servername wird abgewiesen, nicht bedient.
    server {
        listen              8443 ssl default_server;
        ssl_reject_handshake on;
    }

    server {
        listen      8443 ssl;
        server_name localhost edge;

        ssl_certificate     /etc/nginx/certs/edge.crt;
        ssl_certificate_key /etc/nginx/certs/edge.key;

        ssl_protocols              TLSv1.2 TLSv1.3;
        ssl_ciphers                ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305;
        ssl_prefer_server_ciphers  on;
        ssl_session_tickets        off;

        # add_header erbt nicht automatisch und wirkt ohne "always" nicht auf
        # 4xx/5xx (Sitzung 5, 3.3) - deshalb alles gebuendelt, jede Zeile mit "always".
          # max-age bewusst niedrig (Entwicklung): HSTS ist klebrig, der Browser
        # merkt sich die Anweisung fuer die volle Dauer. Vor Produktion auf
        # 31536000 (1 Jahr) erhoehen - aber ERST wenn HTTPS zuverlaessig steht.
        add_header Strict-Transport-Security "max-age=300" always;
        add_header X-Content-Type-Options    "nosniff"     always;
        add_header X-Frame-Options           "DENY"        always;
        add_header Referrer-Policy           "no-referrer" always;
        add_header Content-Security-Policy   "default-src 'none'; frame-ancestors 'none'" always;

        limit_req  zone=perip burst=20 nodelay;
        limit_conn perip_conn 20;

        location / {
            set $upstream_api https://api:8443;
            proxy_pass $upstream_api;

            proxy_http_version 1.1;

            proxy_ssl_verify              on;
            proxy_ssl_trusted_certificate /etc/nginx/ca/local-dev-ca.crt;
            proxy_ssl_name                api;

            proxy_set_header Host              $host;
            proxy_set_header X-Forwarded-For   $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
