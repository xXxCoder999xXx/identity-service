name: identity-service

networks:
  edge:
    internal: true
  public:

services:
  nginx:
    image: nginxinc/nginx-unprivileged:1.30.4@sha256:324ae106322ff873e4ef4d48bda2cfd13ba761eca60bceb8e44a67b135f3adc5
    networks:
      - edge
      - public
    ports:
      - "127.0.0.1:8443:8443"
    read_only: true
    tmpfs:
      - /tmp:mode=0700,uid=101,gid=101
      - /var/cache/nginx:mode=0700,uid=101,gid=101
      - /var/run:mode=0700,uid=101,gid=101
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    volumes:
      - ./certs/edge:/etc/nginx/certs:ro
      - ./certs/ca:/etc/nginx/ca:ro              # fuer proxy_ssl_trusted_certificate
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    mem_limit: 128m
    cpus: 0.5
    restart: unless-stopped
    depends_on:
      - api

  api:
    build:
      context: .
      dockerfile: Dockerfile
    networks:
      - edge
    read_only: true
    tmpfs:
      - /tmp:mode=0700,uid=1654,gid=1654
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_HTTPS_PORTS: "8443"
      Kestrel__Certificates__Default__Path: /certs/api.crt
      Kestrel__Certificates__Default__KeyPath: /certs/api.key
    volumes:
      - ./certs/api:/certs:ro
    mem_limit: 256m
    cpus: 1.0
    restart: unless-stopped
