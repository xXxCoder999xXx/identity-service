name: identity-service

networks:
  edge:
    internal: true
  public:

services:
  nginx:
    image: nginxinc/nginx-unprivileged:1.30.5@sha256:d715f7a85cdfea820fec743ea5aee8a22f91e00ff310ad6275d2638112d8cf8d
    networks:
      - edge
      - public
    ports:
      - target: 8443
        published: "8443"
        protocol: tcp
        host_ip: 127.0.0.1
    read_only: true
    # tmpfs bewusst in Kurzform: die Langform ueber volumes/type: tmpfs
    # unterstuetzt uid/gid nicht, die hier zwingend sind (nginx laeuft als 101).
    tmpfs:
      - /tmp:mode=0700,uid=101,gid=101
      - /var/cache/nginx:mode=0700,uid=101,gid=101
      - /var/run:mode=0700,uid=101,gid=101
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    volumes:
      - type: bind
        source: ./certs/edge
        target: /etc/nginx/certs
        read_only: true
      - type: bind
        source: ./certs/ca
        target: /etc/nginx/ca
        read_only: true
      - type: bind
        source: ./nginx.conf
        target: /etc/nginx/nginx.conf
        read_only: true
    mem_limit: 128m
    cpus: 0.5
    restart: unless-stopped
    depends_on:
      api:
        condition: service_started

  api:
    build:
      context: .
      dockerfile: Dockerfile
    networks:
      - edge
    read_only: true
    tmpfs:
      - /tmp:mode=0700,uid=1654,gid=1654
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_HTTPS_PORTS: "8443"
      Kestrel__Certificates__Default__Path: /certs/api.crt
      Kestrel__Certificates__Default__KeyPath: /certs/api.key
    volumes:
      - type: bind
        source: ./certs/api
        target: /certs
        read_only: true
    mem_limit: 256m
    cpus: 1.0
    restart: unless-stopped
