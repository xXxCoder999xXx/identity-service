# ---------------------------------------------------------------------------
# nginx.staging.conf - einziger Einstiegspunkt auf Staging (Zero-Trust-Edge)
# Eingebunden ueber compose.staging.yaml (E-5-79).
#
# Staging-Variante von nginx.conf. Die Haertung steht in nginx/snippets/
# (E-5-81) und gilt unveraendert; hier steht nur, was sich unterscheidet:
# Port 80 fuer HTTP-01 und Weiterleitung, Zertifikat von lego, Servername
# von aussen, HSTS-Dauer.
# Snippets werden einzeln per festem Namen eingebunden, nie per Wildcard.
#
# Der Servername steht nicht im Repository (ADR-004): server_name.conf kommt
# vom Server und enthaelt genau eine Zeile "server_name <name>;" (E-5-82).
# Kein Wert aus der Anfrage (SNI, Host) wird zu einem Dateipfad oder einem
# Weiterleitungsziel.
# ---------------------------------------------------------------------------

worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;

    include /etc/nginx/snippets/http-common.conf;

    # ---- Port 80 (Container 8080) ------------------------------------------

    # Catch-all: unbekannter Host, Verbindung ohne Antwort schliessen (E-5-83).
    server {
        listen 8080 default_server;
        return 444;
    }

    server {
        listen 8080;
        include /etc/nginx/site/server_name.conf;

        # Port 80 ist genauso oeffentlich wie 443 (E-5-90).
        include /etc/nginx/snippets/limits.conf;

        # HTTP-01: lego legt die Antwort unter
        # <webroot>/.well-known/acme-challenge/<token> ab. Nur GET (HEAD ist
        # darin enthalten), nur vorhandene Dateien, sonst 404. ^~ verhindert,
        # dass eine spaetere Regex-location diesen Pfad uebernimmt.
        location ^~ /.well-known/acme-challenge/ {
            limit_except GET {
                deny all;
            }
            root /var/www/acme;
            default_type text/plain;
            try_files $uri =404;
        }

        # Alles andere auf HTTPS. $server_name ist der Name aus
        # server_name.conf, nicht der Host der Anfrage: Das Ziel ist nicht
        # lenkbar. 308 behaelt die Methode bei (E-5-83).
        location / {
            return 308 https://$server_name$request_uri;
        }
    }

    # ---- Port 443 (Container 8443) -----------------------------------------

    # Catch-all: unbekannter Servername wird abgewiesen, nicht bedient.
    server {
        listen               8443 ssl default_server;
        ssl_reject_handshake on;
    }

    server {
        listen      8443 ssl;
        include /etc/nginx/site/server_name.conf;

        # Von lego unter festem Namen gespeichert (--cert.name edge, E-5-82).
        ssl_certificate     /etc/nginx/acme/edge.crt;
        ssl_certificate_key /etc/nginx/acme/edge.key;
        include /etc/nginx/snippets/tls.conf;

        # HSTS auf Staging 1 Tag (E-5-89): lang genug fuer Messungen und DAST,
        # kurz genug, falls das Zertifikat ausfaellt. Ohne includeSubDomains
        # und ohne preload. Vor Production: 1 Jahr.
        # Im selben Kontext wie die uebrigen Header (security-headers.conf).
        add_header Strict-Transport-Security "max-age=86400" always;
        include /etc/nginx/snippets/security-headers.conf;

        include /etc/nginx/snippets/limits.conf;

        location / {
            include /etc/nginx/snippets/proxy-api.conf;
        }
    }
}
